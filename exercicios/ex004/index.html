<!DOCTYPE html>

<head>

</head>
<body>
    <h1>Qual Pais voce reside?</h1>
    Digite seu Pais <input type="text" name="txtpais" id="txtpais">

            var res = window.document.querySelector('div#res')

            res.innerHTML = `<p>Voce e <strong>${pais}</strong></p>`

            if(res == pais) 
            res.innerHTML = 'Voce e <strong>Brasileiro</strong>'
            
            }
    </script>
    
</body>
